# Tool settings only. The dependencies are in requirements.txt and requirements-dev.txt.

[tool.ruff]
line-length = 100
target-version = "py312"
src = [".", "tests"]
# Raft's file, kept exactly as provided.
extend-exclude = ["dummy_customer_api.py"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "PT", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
